services:
  wizard:
    build: .
    image: wizard:latest
    container_name: wizard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set this to enable the read-only admin dashboard at /admin.
      # Leave unset (or delete the line) to keep it disabled.
      # Generate one with: openssl rand -hex 32
      - ADMIN_TOKEN=
